name: Testar BNP — OAI-PMH

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-bnp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Testar ligação à BNP
        run: python scripts/test_bnp.py
