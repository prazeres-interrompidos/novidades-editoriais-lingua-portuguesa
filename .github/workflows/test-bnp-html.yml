name: Testar BNP — Diagnóstico HTML

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Diagnosticar HTML da BNP
        run: python scripts/test_bnp_html.py

      - name: Guardar HTML para análise
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bnp-diagnostico-html
          path: |
            bnp-diagnostico.html
            bnp-amostra-isbn.html
