name: Testar BNP — Extração de registos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-bnp-extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Testar extração do catálogo BNP
        run: python scripts/test_bnp_extract.py
