name: Testar BNP — Catálogo público

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-bnp-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Testar catálogo público da BNP
        run: python scripts/test_bnp_catalog.py
